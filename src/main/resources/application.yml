spring:
  application:
    name: cicd-dashboard

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cicd_dashboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    # Lets Flyway adopt databases created by the old ddl-auto/init.sql setup
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    # Optional for public repositories (60 requests/hour without, 5000 with)
    token: ${GITHUB_TOKEN:}
    timeout: ${GITHUB_API_TIMEOUT:10000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  github-sync-rate: ${SCHEDULER_GITHUB_SYNC_RATE:300000}  # 5 minutes in milliseconds
  # By default every repository added through the dashboard/API is synced.
  # Listing repositories here restricts syncing to just these (id = database repository ID):
  # repositories:
  #   - id: 1
  #     owner: spring-projects
  #     repo: spring-boot
  #     enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.peraton.cicd: ${LOG_LEVEL:INFO}
